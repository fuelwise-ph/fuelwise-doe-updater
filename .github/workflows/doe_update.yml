
name: FuelWise DOE Report Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  discover-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Discover DOE reports
        run: python discover_doe_report.py
      
      - name: Publish latest report JSON
        run: |
          test -s latest_report.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_report.json
          if git diff --cached --quiet; then
            echo "No new report changes."
          else
            git commit -m "Update latest DOE report"
            git push
          fi
